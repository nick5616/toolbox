[project]
name = "toolbox-sidecar"
version = "0.7.0"
description = "Toolbox AI engine: stems, BPM & key, audio-to-MIDI, transcription, background removal, CPU upscaling, OCR, redaction, object removal, voice denoising and music visualisation analysis over stdio JSON lines"
requires-python = ">=3.12,<3.13"
dependencies = [
  "audio-separator[cpu]==0.47.1",
  "audioread>=3.0",        # imported by audio-separator but not declared
  "librosa>=1.0,<2",
  "onnxruntime>=1.31",
  "soundfile>=0.14",
  "numpy>=2.5",
  "psutil>=7",
  "pretty_midi>=0.2.11",
  "mir_eval>=0.8",
  "basic-pitch==0.4.0",
  "faster-whisper>=1.2.1",
  "av>=16,<19",            # PyAV 19 breaks faster-whisper 1.2.1 (metadata_errors TypeError)
  "pillow>=12",            # image handlers (already pulled in by torchvision)
  "pillow-heif>=1.8",      # HEIC/HEIF input
  "spandrel>=0.4.2",       # CPU/MPS Real-ESRGAN upscaling
  "rapidocr>=3.10.0",      # OCR engine (bundled PP-OCRv6 models)
  "python-bidi>=0.6.12",   # Arabic text order for RapidOCR
  "pypdf>=6",              # searchable-PDF text overlay
  "opencv-python-headless>=5.0.0.93",  # face detection (YuNet decode), image ops; already pulled in by rapidocr
  "sam-2",                # SAM 2.1 (facebookresearch/sam2, pinned in [tool.uv.sources])
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# basic-pitch 0.4.0 hard-requires tensorflow<2.15.1 (no py3.12 wheels) and
# coremltools on macOS. We only use its bundled ONNX model via onnxruntime.
exclude-dependencies = ["tensorflow", "tensorflow-macos", "coremltools"]
# resampy<0.4.3 (basic-pitch's pin) imports pkg_resources, removed in setuptools 81.
override-dependencies = ["resampy>=0.4.3"]
# sam2 is sdist-only and its build-system requires torch: build it against the
# venv's torch (no 140 MB build-env download) and never try the CUDA extension.
no-build-isolation-package = ["sam-2"]
extra-build-variables = { sam-2 = { SAM2_BUILD_CUDA = "0" } }

[tool.uv.sources]
sam-2 = { url = "https://github.com/facebookresearch/sam2/archive/2b90b9f5ceec907a1c18123530e92e794ad901a4.tar.gz" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model downloads; run with TOOLBOX_SLOW=1"]
